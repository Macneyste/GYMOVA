name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymova
          POSTGRES_PASSWORD: gymova
          POSTGRES_DB: gymova_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gymova -d gymova_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gymova:gymova@localhost:5432/gymova_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh-secret
      QR_TOKEN_SECRET: ci-qr-secret-ci-qr-secret-ci-qr-secret-ci-qr
      AI_PROVIDER: mock
      STORAGE_DRIVER: local
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Apply migrations to test database
        run: npm run db:deploy
      - name: Seed reference data
        run: npm run db:seed
      - name: API end-to-end tests
        run: npm run test:e2e
      - name: Build API and admin
        run: npm run build
